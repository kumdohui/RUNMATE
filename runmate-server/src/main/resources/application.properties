# 애플리케이션 이름
spring.application.name=runmate-server


# =========================
# MySQL 연결 설정
# =========================

# DB_URL 환경변수가 있으면 그 값을 사용합니다.
# 환경변수가 없으면 localhost의 3307번 포트를 통해 community_db에 연결합니다.
# 3307은 SSH 터널로 Ubuntu 서버의 MySQL 3306 포트에 연결하기 위한 로컬 포트입니다.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/community_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}

# DB_USERNAME 환경변수가 없으면 runmate_app 계정을 사용합니다.
spring.datasource.username=${DB_USERNAME:runmate_app}

# DB 비밀번호는 파일에 직접 적지 않고 DB_PASSWORD 환경변수에서 가져옵니다.
spring.datasource.password=${DB_PASSWORD}


# =========================
# JPA 설정
# =========================

# 프로그램 시작 시 Entity와 기존 DB 테이블 구조가 맞는지 검사합니다.
# 테이블을 자동으로 생성하거나 수정하지는 않습니다.
spring.jpa.hibernate.ddl-auto=validate

# Controller까지 DB 연결을 계속 유지하지 않도록 설정합니다.
# DB 조회는 Service 계층 안에서 처리하도록 유도합니다.
spring.jpa.open-in-view=false


# =========================
# Redis 연결 설정
# =========================

# REDIS_HOST 환경변수가 없으면 localhost를 사용합니다.
# 로컬 개발에서는 SSH 터널을 통해 Ubuntu 서버의 Redis에 연결합니다.
spring.data.redis.host=${REDIS_HOST:localhost}

# REDIS_PORT 환경변수가 없으면 로컬의 6380번 포트를 사용합니다.
# 6380은 SSH 터널로 Redis의 실제 6379 포트에 연결하기 위한 로컬 포트입니다.
spring.data.redis.port=${REDIS_PORT:6380}

# Redis 비밀번호는 파일에 직접 적지 않고 REDIS_PASSWORD 환경변수에서 가져옵니다.
spring.data.redis.password=${REDIS_PASSWORD}


# =========================
# 로그인 세션 설정
# =========================

# 로그인 세션의 유효 시간을 30분으로 설정합니다.
# 사용자가 30분 동안 요청하지 않으면 세션이 만료됩니다.
spring.session.timeout=30m

# Spring Session Data Redis 의존성이 있으므로
# 로그인 세션은 Redis에 저장됩니다.
# Spring Boot 4에서는 spring.session.store-type=redis를 따로 적지 않습니다.


# =========================
# 문자 인코딩 설정
# =========================

# 요청과 응답에서 사용할 기본 문자 인코딩을 UTF-8로 설정합니다.
spring.servlet.encoding.charset=UTF-8

# Spring의 문자 인코딩 처리를 활성화합니다.
spring.servlet.encoding.enabled=true

# 요청과 응답에 UTF-8 인코딩을 적용합니다.
spring.servlet.encoding.force=true